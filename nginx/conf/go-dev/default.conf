# Docker Compose go-dev: react-client-go-dev (Vite) + go-server-dev
upstream frontend_go_dev {
    server react-client-go-dev:3000;
    keepalive 16;
}

upstream backend_go_dev {
    server go-server-dev:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend_go_dev;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://backend_go_dev;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://frontend_go_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
