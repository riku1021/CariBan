# Docker Compose go-prod: react-client-go-prod + go-server-prod
upstream frontend_go_prod {
    server react-client-go-prod:4173;
    keepalive 16;
}

upstream backend_go_prod {
    server go-server-prod:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend_go_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://backend_go_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://frontend_go_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
