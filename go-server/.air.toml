root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/api"
  cmd = "go build -o ./tmp/api ./cmd/api"
  delay = 500
  exclude_dir = ["tmp", "envs", "docs", "migrations"]
  include_ext = ["go"]
  kill_delay = "2s"
  send_interrupt = true

[log]
  time = true
  main_only = true

[misc]
  clean_on_exit = true
